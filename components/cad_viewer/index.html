<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; background: transparent; font-family: 'Inter Tight', system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 540px; border-radius: 14px; overflow: hidden; touch-action: none;
    background: radial-gradient(ellipse at 50% 30%, #1B1B1A 0%, #0B0B0A 80%); border: 1px solid #2A2927; }
  #wrap.pen { border-color: #D27A52; }
  #gl, #ink { position: absolute; inset: 0; }
  #ink { pointer-events: none; }
  #wrap.pen #ink { pointer-events: auto; cursor: crosshair; }
  #bar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 170px); }
  #bar button { background: rgba(23,23,22,.92); color: #EDEBE6; border: 1px solid #2A2927; font-family: inherit;
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: all .15s; }
  #bar button:hover { border-color: #8C8880; }
  #bar button.on { border-color: #6FA08E; color: #6FA08E; background: rgba(111,160,142,.10); }
  #bar button#pen.on { border-color: #D27A52; color: #D27A52; background: rgba(210,122,82,.10); }
  #dims { position: absolute; left: 12px; top: 10px; color: #EDEBE6; font-size: 12px; z-index: 5;
    background: rgba(23,23,22,.92); padding: 5px 10px; border-radius: 8px; border: 1px solid #2A2927; }
  .cn { position: absolute; width: 14px; height: 14px; border-color: #3a3936; border-style: solid; border-width: 0; z-index: 4; pointer-events: none; }
  .cn.tl { left: 8px; top: 8px; border-left-width: 1px; border-top-width: 1px; }
  .cn.tr { right: 8px; top: 8px; border-right-width: 1px; border-top-width: 1px; }
  .cn.bl { left: 8px; bottom: 8px; border-left-width: 1px; border-bottom-width: 1px; }
  .cn.br { right: 8px; bottom: 8px; border-right-width: 1px; border-bottom-width: 1px; }
  #dims, #hint, #toast { font-family: "JetBrains Mono", ui-monospace, monospace; letter-spacing: .02em; }
  #bar button { font-size: 11.5px; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: #8C8880; font-size: 12px; z-index: 5; pointer-events: none; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; font-size: 12px;
    background: #EDEBE6; color: #0E0E0D; border: 1px solid #EDEBE6; padding: 6px 12px;
    border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="ink"></canvas>
  <div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>
  <div id="dims"></div>
  <div id="bar">
    <button id="pen" title="Draw on the model to mark a problem. Rough circles, boxes and arrows snap to clean shapes. Drag a mark to move it.">Mark</button>
    <button id="undo" title="Remove the last mark">Undo</button>
    <button id="clear" title="Remove all marks">Clear</button>
    <button id="dimsbtn" class="on" title="Show / hide measurements">Dimensions</button>
    <button id="rot" class="on">Rotate</button>
    <button id="wire">Wireframe</button>
    <button id="reset">Reset view</button>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
</div>

<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {STLLoader} from "three/addons/loaders/STLLoader.js";
import {Line2} from "three/addons/lines/Line2.js";
import {LineMaterial} from "three/addons/lines/LineMaterial.js";
import {LineGeometry} from "three/addons/lines/LineGeometry.js";

/* ---------------- Streamlit component protocol (no build step needed) ---------------- */
const send = (type, data = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
const setValue = (value) => send("streamlit:setComponentValue", {value, dataType: "json"});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 552});

/* ---------------- scene ---------------- */
const $ = (id) => document.getElementById(id);
const wrap = $("wrap"), gl = $("gl"), ink = $("ink");
const ictx = ink.getContext("2d");
let W = wrap.clientWidth, H = wrap.clientHeight;
const renderer = new THREE.WebGLRenderer({canvas: gl, antialias: true, alpha: true});
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a28, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.45); rim.position.set(-4, 2, -3); scene.add(rim);

const controls = new OrbitControls(camera, gl);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7; controls.panSpeed = 0.6;
controls.enableZoom = false;              // replaced by the smooth zoom-to-cursor below
controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
controls.addEventListener("change", () => { needsOcc = true; });

const group = new THREE.Group(); group.rotation.x = -Math.PI / 2; scene.add(group);   // CAD Z-up -> three Y-up
let mesh = null, edges = null, grid = null, axes = null, mat = null;
let modelId = null, r = 50, minD = 1, maxD = 1000;
const home = new THREE.Vector3(), cadCenter = new THREE.Vector3();

function resize() {
  if (!wrap.clientWidth || !wrap.clientHeight) return;   // not laid out yet: keep the last good size
  W = wrap.clientWidth; H = wrap.clientHeight;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
  const dpr = window.devicePixelRatio;
  ink.width = W * dpr; ink.height = H * dpr; ink.style.width = W + "px"; ink.style.height = H + "px";
  ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const mt of markMats) mt.resolution.set(W, H);   // thick 3D lines need the viewport size
}
window.addEventListener("resize", resize);
// the iframe can change size without a window resize (layout, tabs, drawer): keep 3D and overlay in sync
new ResizeObserver(resize).observe(wrap);

function loadModel(b64) {
  if (mesh) { group.remove(mesh); group.remove(edges); scene.remove(grid); group.remove(axes); }
  clearMarks(false);
  const bin = atob(b64); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const geo = new STLLoader().parse(buf.buffer);
  geo.computeBoundingBox(); geo.boundingBox.getCenter(cadCenter);   // remember true CAD coordinates
  geo.computeVertexNormals(); geo.center();
  mat = new THREE.MeshStandardMaterial({color: 0xA7AFB2, metalness: 0.3, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1});
  mesh = new THREE.Mesh(geo, mat); group.add(mesh);
  edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28),
    new THREE.LineBasicMaterial({color: 0x0a0a0a, transparent: true, opacity: .5}));
  group.add(edges);
  geo.computeBoundingSphere(); geo.computeBoundingBox();
  r = geo.boundingSphere.radius; const bb = geo.boundingBox;
  grid = new THREE.GridHelper(r * 6, 24, 0x34332f, 0x222120);
  grid.position.y = -(bb.max.z - bb.min.z) / 2 - r * 0.001; scene.add(grid);
  // axes in the CAD frame (inside the rotated group): red = X, green = Y, blue = Z (up)
  // small axis marker just off the part's corner (not far away in empty space)
  const pad = Math.max(r * 0.08, 2);
  axes = new THREE.AxesHelper(r * 0.35); axes.position.set(bb.min.x - pad, bb.min.y - pad, bb.min.z); group.add(axes);
  axes.setColors(new THREE.Color(0xD27A52), new THREE.Color(0x6FA08E), new THREE.Color(0x8C8880));
  home.set(r * 2.9, r * 2.1, r * 3.2);   // a little room around the part for the dimension labels
  camera.position.copy(home); controls.target.set(0, 0, 0); controls.update();
  minD = r * 0.35; maxD = r * 12;
}

/* ---------------- smooth zoom toward the cursor (works in pen mode too) ---------------- */
let zoomAcc = 0;
const zoomPivot = new THREE.Vector3();
const ray = new THREE.Raycaster();
const tmpV = new THREE.Vector3();

wrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  let dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  dy = Math.max(-100, Math.min(100, dy));           // tame fast wheels and trackpad bursts
  zoomAcc += dy * 0.0011;                            // log-space: ~11% per normal wheel notch
  zoomAcc = Math.max(-0.6, Math.min(0.6, zoomAcc));
  const rect = wrap.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hit = mesh && pick(x, y);
  if (hit) zoomPivot.copy(hit.point);
  else {   // empty space: pivot on the plane through the orbit target, facing the camera
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmpV).negate(), controls.target);
    if (!ray.ray.intersectPlane(plane, zoomPivot)) zoomPivot.copy(controls.target);
  }
  stopAutoRotate();
}, {passive: false});

let lastT = performance.now();
function applyZoom() {
  const now = performance.now(), dt = Math.min((now - lastT) / 1000, 0.25); lastT = now;
  if (Math.abs(zoomAcc) < 1e-4) { zoomAcc = 0; return; }
  const step = zoomAcc * (1 - Math.exp(-dt * 14)); zoomAcc -= step;   // time-based ease-out (~0.25 s)
  const dist = camera.position.distanceTo(controls.target);
  if (!isFinite(dist) || dist <= 0) { zoomAcc = 0; return; }
  const nd = THREE.MathUtils.clamp(dist * Math.exp(step), minD, maxD);
  const k = nd / dist;
  if (Math.abs(k - 1) < 1e-6) { zoomAcc = 0; return; }
  needsOcc = true;
  camera.position.sub(zoomPivot).multiplyScalar(k).add(zoomPivot);
  controls.target.sub(zoomPivot).multiplyScalar(k).add(zoomPivot);
}

/* ---------------- toolbar ---------------- */
let penMode = false;
function stopAutoRotate() { controls.autoRotate = false; $("rot").classList.remove("on"); }
$("rot").onclick = () => { controls.autoRotate = !controls.autoRotate; $("rot").classList.toggle("on", controls.autoRotate); };
$("wire").onclick = () => { mat.wireframe = !mat.wireframe; edges.visible = !mat.wireframe; $("wire").classList.toggle("on", mat.wireframe); };
$("reset").onclick = () => { zoomAcc = 0; camera.position.copy(home); controls.target.set(0, 0, 0); };
$("pen").onclick = () => setPen(!penMode);
let showDims = true;
$("dimsbtn").onclick = () => { showDims = !showDims; $("dimsbtn").classList.toggle("on", showDims); };
$("undo").onclick = () => { const m = marks.pop(); if (m) { disposeMark(m); publish(); } };
$("clear").onclick = () => clearMarks(true);
gl.addEventListener("pointerdown", stopAutoRotate);

function setHint() {
  $("hint").textContent = penMode
    ? "draw a circle, box or arrow on the problem · drag a mark to move it · scroll to zoom"
    : "drag: rotate · scroll: zoom to cursor · right-drag: pan";
}
function setPen(on) {
  penMode = on; wrap.classList.toggle("pen", on); $("pen").classList.toggle("on", on);
  controls.enabled = !on;
  if (on) stopAutoRotate();
  setHint();
}
setHint();

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.opacity = 0, 2400);
}

/* ---------------- marks: real 3D objects lying on the part's surface ---------------- */
// mark = {n, shape, center: Vector3, normal: Vector3, dims: {...mm}, size_mm, point: [x,y,z] true CAD mm,
//         obj: THREE.Group (lines), badge: Sprite, mats: [LineMaterial]}
// center/normal live in the mesh frame (the centred CAD frame), so a mark rotates, zooms and is hidden by
// the part exactly like the geometry itself.
let marks = [];
const markGroup = new THREE.Group(); group.add(markGroup);
const markMats = [];
let needsOcc = true;                    // badge visibility (is it hidden behind the part?) must be recomputed

function pick(x, y) {
  ray.setFromCamera(new THREE.Vector2((x / W) * 2 - 1, -(y / H) * 2 + 1), camera);
  return mesh ? (ray.intersectObject(mesh, false)[0] || null) : null;
}

function project(local) {   // -> {x, y, pxPerMm, behind}
  const world = mesh.localToWorld(local.clone());
  const dist = camera.position.distanceTo(world);
  const p = world.clone().project(camera);
  const pxPerMm = H / (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  return {x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H, pxPerMm, behind: p.z > 1};
}

function mmPerPxAt(worldPoint) {
  const dist = camera.position.distanceTo(worldPoint);
  return 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / H;
}

const _inv = new THREE.Matrix4();
function rayLocal(x, y) {   // the pointer's ray expressed in the mesh frame
  ray.setFromCamera(new THREE.Vector2((x / W) * 2 - 1, -(y / H) * 2 + 1), camera);
  mesh.updateWorldMatrix(true, false);
  return ray.ray.clone().applyMatrix4(_inv.copy(mesh.matrixWorld).invert());
}

function planeBasis(n) {    // two axes lying in the plane, aligned with the model's own X / Y / Z
  const ref = Math.abs(n.z) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1);
  const u = ref.clone().sub(n.clone().multiplyScalar(ref.dot(n))).normalize();
  const v = new THREE.Vector3().crossVectors(n, u);
  return {u, v};
}

function makeBadge(n) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  x.fillStyle = "#D27A52"; x.beginPath(); x.arc(32, 32, 28, 0, Math.PI * 2); x.fill();
  x.lineWidth = 4; x.strokeStyle = "#0E0E0D"; x.stroke();
  x.fillStyle = "#0E0E0D"; x.font = "bold 34px system-ui"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(n, 32, 35);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), depthTest: false, transparent: true}));
  sp.renderOrder = 10;
  return sp;
}

function boxQuad(d, minR) {   // 4 corners in plane coords (relative to the mark's centre)
  if (d.pts && d.pts.length === 4) return d.pts;
  const w = Math.max(d.w, 2 * minR) / 2, h = Math.max(d.h, 2 * minR) / 2;
  return [[-w, -h], [w, -h], [w, h], [-w, h]];
}

function distToSegment(a, b, p, q, r) {   // distance from (a,b) to segment p-q
  const dx = q[0] - p[0], dy = q[1] - p[1], L2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((a - p[0]) * dx + (b - p[1]) * dy) / L2));
  return Math.hypot(a - (p[0] + t * dx), b - (p[1] + t * dy));
}

function disposeMark(m) {
  if (m.obj) {
    markGroup.remove(m.obj);
    m.obj.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.map) o.material.map.dispose(); if (o.material) o.material.dispose(); });
  }
  (m.mats || []).forEach((mt) => { const i = markMats.indexOf(mt); if (i >= 0) markMats.splice(i, 1); });
  m.obj = null; m.mats = [];
}

function buildMarkObject(m) {
  disposeMark(m);
  const {u, v} = planeBasis(m.normal);
  const lift = Math.max(r * 0.004, 0.08);                       // float a hair above the surface (no z-fighting)
  const at = (a, b) => m.center.clone().addScaledVector(u, a).addScaledVector(v, b).addScaledVector(m.normal, lift);
  const minR = Math.max(r * 0.012, 0.3), d = m.dims || {r: m.size_mm || 3};
  let pts = [], badgeAt;
  if (m.shape === "circle" || m.shape === "ellipse") {
    const rx = Math.max(d.r ?? d.rx, minR), ry = Math.max(d.r ?? d.ry, minR);
    for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2; pts.push(at(Math.cos(a) * rx, Math.sin(a) * ry)); }
    badgeAt = at(rx * 0.72, ry * 0.72);
  } else if (m.shape === "box") {
    const q = boxQuad(d, minR);
    pts = [...q, q[0]].map(([a, b]) => at(a, b));
    badgeAt = at(q[2][0], q[2][1]);
  } else {   // arrow: tail -> head (the head is the mark's centre)
    const L = Math.hypot(d.dx, d.dy) || 1, t0 = -d.dx / L, t1 = -d.dy / L;
    const hl = Math.min(Math.max(L * 0.25, r * 0.03), r * 0.12);
    const bx = -t0 * hl, by = -t1 * hl, px = -t1 * hl * 0.45, py = t0 * hl * 0.45;
    pts = [at(d.dx, d.dy), at(0, 0), at(bx + px, by + py), at(0, 0), at(bx - px, by - py)];
    badgeAt = at(d.dx, d.dy);
  }
  const geo = new LineGeometry(); geo.setPositions(pts.flatMap((p) => [p.x, p.y, p.z]));
  const mt = new LineMaterial({color: 0xD27A52, linewidth: 2.8, resolution: new THREE.Vector2(W, H), depthTest: true, transparent: true});
  markMats.push(mt);
  const line = new Line2(geo, mt); line.computeLineDistances(); line.renderOrder = 5;
  const badge = makeBadge(m.n); badge.position.copy(badgeAt);
  const obj = new THREE.Group(); obj.add(line); obj.add(badge); markGroup.add(obj);
  m.obj = obj; m.badge = badge; m.mats = [mt];
  needsOcc = true;
}

function setPoint(m) {      // true CAD coordinates (mm), what Python / the LLM sees
  m.point = m.center.clone().add(cadCenter).toArray().map((x) => +x.toFixed(2));
}

function refreshMark(m) { setPoint(m); buildMarkObject(m); }

function clearMarks(doPublish) {
  marks.forEach(disposeMark); marks = [];
  if (doPublish) publish();
}

function updateBadges() {   // constant on-screen size, hidden while the part is in front of it
  for (const m of marks) {
    if (!m.badge) continue;
    const wp = m.badge.getWorldPosition(new THREE.Vector3());
    m.badge.scale.setScalar(mmPerPxAt(wp) * 24);
    if (needsOcc && mesh) {
      const dir = wp.clone().sub(camera.position), dist = dir.length(); dir.normalize();
      ray.set(camera.position, dir);
      const hit = ray.intersectObject(mesh, false)[0];
      m.badge.visible = !hit || hit.distance > dist - Math.max(r * 0.03, 0.8);
    }
  }
  needsOcc = false;
}

/* a new mark from a drawn stroke: find the surface it was drawn on, lay the clean shape on that surface */
function addMarkFromStroke(pts) {
  if (!mesh) return;
  const hits = [], step = Math.max(1, Math.floor(pts.length / 28));
  const probe = (x, y) => { const h = pick(x, y); if (h) hits.push({p: mesh.worldToLocal(h.point.clone()), n: h.face.normal.clone()}); };
  for (let i = 0; i < pts.length; i += step) probe(pts[i][0], pts[i][1]);
  probe(pts[pts.length - 1][0], pts[pts.length - 1][1]);
  if (hits.length < 2) { toast("That mark isn't on the part — draw on the model itself."); return; }
  // the surface = the biggest group of hits that share (almost) the same normal
  let best = null;
  for (const h of hits) {
    const cnt = hits.reduce((a, o) => a + (h.n.dot(o.n) > 0.97 ? 1 : 0), 0);
    if (!best || cnt > best.cnt) best = {n: h.n, cnt};
  }
  const cl = hits.filter((h) => h.n.dot(best.n) > 0.97);
  const n = cl.reduce((a, h) => a.add(h.n), new THREE.Vector3()).normalize();
  const c0 = cl.reduce((a, h) => a.add(h.p), new THREE.Vector3()).multiplyScalar(1 / cl.length);
  const {u, v} = planeBasis(n);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, c0);
  // lift every stroke point onto that plane (also where the stroke crosses a hole), in plane coordinates (mm)
  const P = [];
  for (const [x, y] of pts) {
    const q = rayLocal(x, y).intersectPlane(plane, new THREE.Vector3());
    if (q) { q.sub(c0); P.push([q.dot(u), q.dot(v)]); }
  }
  if (P.length < 4) { toast("Draw on a surface that faces you."); return; }
  // what the user meant = what they drew on screen (a box stays a box on a tilted face); how big it really is
  // comes from the stroke lifted onto the surface plane (true millimetres)
  const type = recognize(pts).type;
  const xs = P.map((p) => p[0]), ys = P.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const bw = x1 - x0, bh = y1 - y0, mid = [(x0 + x1) / 2, (y0 + y1) / 2];
  let ctr, dims, size, shape = type;
  if (type === "arrow") {
    const tail = P[0], head = P[P.length - 1];
    ctr = head; dims = {dx: tail[0] - head[0], dy: tail[1] - head[1]}; size = 0;
  } else if (type === "box") {   // the four corners of the drawn rectangle, lifted onto the surface (a real quad)
    const sx = pts.map((p) => p[0]), sy = pts.map((p) => p[1]);
    const X0 = Math.min(...sx), X1 = Math.max(...sx), Y0 = Math.min(...sy), Y1 = Math.max(...sy);
    const cq = [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]].map(([x, y]) => {
      const q = rayLocal(x, y).intersectPlane(plane, new THREE.Vector3());
      return q ? [q.sub(c0).dot(u), q.sub(c0).dot(v)] : null;
    });
    if (cq.some((c) => !c)) { toast("Draw that box on a surface that faces you."); return; }
    ctr = [(cq[0][0] + cq[2][0]) / 2, (cq[0][1] + cq[2][1]) / 2];
    const rel = cq.map(([a, b]) => [a - ctr[0], b - ctr[1]]);
    const w = Math.hypot(cq[1][0] - cq[0][0], cq[1][1] - cq[0][1]), h = Math.hypot(cq[2][0] - cq[1][0], cq[2][1] - cq[1][1]);
    dims = {w, h, pts: rel}; size = Math.max(w, h) / 2;
  } else {   // circle / ellipse: a round shape on the surface if it is nearly round there, else an ellipse
    ctr = mid; const rx = bw / 2, ry = bh / 2;
    if (Math.abs(rx - ry) <= 0.25 * Math.max(rx, ry)) { shape = "circle"; dims = {r: (rx + ry) / 2}; size = dims.r; }
    else { shape = "ellipse"; dims = {rx, ry}; size = Math.max(rx, ry); }
  }
  const center = c0.clone().addScaledVector(u, ctr[0]).addScaledVector(v, ctr[1]);
  const num = (marks.length ? marks[marks.length - 1].n : 0) + 1;
  const m = {n: num, shape, center, normal: n.clone(), dims, size_mm: +size.toFixed(1)};
  marks.push(m); refreshMark(m);
  toast(`Mark #${num} added · drag it to move · describe the fix in the chat`);
  publish();
}

function markAt(x, y) {     // topmost mark under the pointer, tested on the mark's own plane (accurate when tilted)
  if (!mesh) return null;
  const rl = rayLocal(x, y), surf = pick(x, y);
  for (let i = marks.length - 1; i >= 0; i--) {
    const m = marks[i];
    const q = rl.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(m.normal, m.center), new THREE.Vector3());
    if (!q) continue;
    const wq = mesh.localToWorld(q.clone());
    if (surf && surf.distance < camera.position.distanceTo(wq) - Math.max(r * 0.03, 0.8)) continue;   // hidden behind the part
    const {u, v} = planeBasis(m.normal), rel = q.sub(m.center), a = rel.dot(u), b = rel.dot(v);
    const slack = mmPerPxAt(wq) * 10, d = m.dims || {};
    // only the outline and the number badge can be grabbed, so new strokes can start inside an existing mark
    let hit = false, bd;
    if (m.shape === "circle" || m.shape === "ellipse") {
      const rx = d.r ?? d.rx, ry = d.r ?? d.ry, rho = Math.hypot(a / rx, b / ry);
      hit = Math.abs(rho - 1) * Math.min(rx, ry) <= slack || Math.min(rx, ry) <= slack * 1.5 && rho <= 1.3;
      bd = [rx * 0.72, ry * 0.72];
    } else if (m.shape === "box") {
      const q = boxQuad(d, 0.3);
      hit = [0, 1, 2, 3].some((k) => distToSegment(a, b, q[k], q[(k + 1) % 4]) <= slack);
      bd = q[2];
    } else {
      const L2 = d.dx * d.dx + d.dy * d.dy || 1, tt = Math.max(0, Math.min(1, (a * d.dx + b * d.dy) / L2));
      hit = Math.hypot(a - tt * d.dx, b - tt * d.dy) <= slack;
      bd = [d.dx, d.dy];
    }
    if (!hit && Math.hypot(a - bd[0], b - bd[1]) <= slack * 1.6) hit = true;   // the number badge
    if (hit) return {m, a, b};
  }
  return null;
}

/* ---------------- live dimensions: overall width / depth / height on the outer edges ---------------- */
const fmtMm = (v) => (Math.round(v * 10) / 10).toString();
function drawDims() {
  if (!showDims || !mesh) return;
  const bb = mesh.geometry.boundingBox;
  const lo = [bb.min.x, bb.min.y, bb.min.z], hi = [bb.max.x, bb.max.y, bb.max.z];
  const c = project(new THREE.Vector3(0, 0, 0));
  const used = [];
  const names = ["X", "Y", "Z"];
  for (let axis = 0; axis < 3; axis++) {
    const len = hi[axis] - lo[axis];
    if (len < 1e-6) continue;
    const o = [0, 1, 2].filter(i => i !== axis);
    let best = null;
    for (const a of [lo, hi]) for (const b of [lo, hi]) {
      const pa = [0, 0, 0], pb = [0, 0, 0];
      pa[o[0]] = pb[o[0]] = a[o[0]]; pa[o[1]] = pb[o[1]] = b[o[1]];
      pa[axis] = lo[axis]; pb[axis] = hi[axis];
      // width & depth are measured on the ground footprint (z = bottom), height on a vertical corner edge
      if (axis !== 2 && pa[2] !== lo[2]) continue;
      const A = project(new THREE.Vector3(...pa)), B = project(new THREE.Vector3(...pb));
      if (A.behind || B.behind) continue;
      const dx = B.x - A.x, dy = B.y - A.y, seg = Math.hypot(dx, dy);
      if (seg < 28) continue;                       // this axis points at the camera
      const ux = dx / seg, uy = dy / seg;
      let nx = -uy, ny = ux;
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      if ((mx - c.x) * nx + (my - c.y) * ny < 0) { nx = -nx; ny = -ny; }
      const out = (mx - c.x) * nx + (my - c.y) * ny;
      const clash = used.some(([px, py]) => Math.abs(px - nx) < .3 && Math.abs(py - ny) < .3);
      let score;
      if (axis !== 2) {
        // width/depth: the footprint edge nearest the camera, so the line is never hidden behind the part
        const mid = mesh.localToWorld(new THREE.Vector3((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, pa[2]));
        score = -camera.position.distanceTo(mid) * 1000 / r + out * 0.01;
      } else {
        score = out + 25 * (0.6 * ny - 0.4 * nx);   // height: outermost vertical edge
      }
      if (clash) score -= 1e6;
      if (!best || score > best.score) best = {score, A, B, ux, uy, nx, ny};
    }
    if (!best) continue;
    const {A, B, ux, uy, nx, ny} = best;
    used.push([nx, ny]);
    const off = 22;
    const a2 = [A.x + nx * off, A.y + ny * off], b2 = [B.x + nx * off, B.y + ny * off];
    ictx.save();
    ictx.strokeStyle = "rgba(111,160,142,.45)"; ictx.lineWidth = 1;
    ictx.beginPath();   // extension lines
    ictx.moveTo(A.x + nx * 4, A.y + ny * 4); ictx.lineTo(a2[0] + nx * 5, a2[1] + ny * 5);
    ictx.moveTo(B.x + nx * 4, B.y + ny * 4); ictx.lineTo(b2[0] + nx * 5, b2[1] + ny * 5);
    ictx.stroke();
    ictx.strokeStyle = "#6FA08E"; ictx.lineWidth = 1.3;
    ictx.beginPath(); ictx.moveTo(...a2); ictx.lineTo(...b2); ictx.stroke();
    ictx.fillStyle = "#6FA08E";
    for (const [p, sx, sy] of [[a2, -ux, -uy], [b2, ux, uy]]) {   // arrowheads
      const L = 8, Wd = 3, bx = p[0] - sx * L, by = p[1] - sy * L;
      ictx.beginPath(); ictx.moveTo(p[0], p[1]); ictx.lineTo(bx - sy * Wd, by + sx * Wd); ictx.lineTo(bx + sy * Wd, by - sx * Wd); ictx.fill();
    }
    // label pill
    const label = `${fmtMm(len)} mm`;
    const lx = (a2[0] + b2[0]) / 2 + nx * 14, ly = (a2[1] + b2[1]) / 2 + ny * 14;
    ictx.font = "500 11px JetBrains Mono, ui-monospace, monospace";
    const tw = ictx.measureText(label).width + 26;
    ictx.fillStyle = "rgba(14,14,13,.92)"; ictx.strokeStyle = "#2F4A42"; ictx.lineWidth = 1;
    ictx.beginPath(); ictx.roundRect ? ictx.roundRect(lx - tw / 2, ly - 11, tw, 22, 11) : ictx.rect(lx - tw / 2, ly - 11, tw, 22);
    ictx.fill(); ictx.stroke();
    ictx.fillStyle = "#EDEBE6"; ictx.textAlign = "center"; ictx.textBaseline = "middle";
    ictx.fillText(label, lx + 6, ly + .5);
    ictx.fillStyle = "#6FA08E";   // axis letter
    ictx.font = "700 10px system-ui"; ictx.fillText(names[axis], lx - tw / 2 + 10, ly + .5);
    ictx.restore();
  }
}

function drawMarks() {      // 2D overlay: live dimension lines and the stroke being drawn (marks are 3D now)
  ictx.clearRect(0, 0, W, H);
  if (!mesh) return;
  drawDims();
  if (stroke) {
    ictx.strokeStyle = "rgba(210,122,82,.6)"; ictx.lineWidth = 2; ictx.lineJoin = ictx.lineCap = "round";
    ictx.beginPath(); stroke.forEach(([px, py], i) => i ? ictx.lineTo(px, py) : ictx.moveTo(px, py)); ictx.stroke();
  }
}

/* ---------------- pen: draw new marks, drag existing ones ---------------- */
let stroke = null, dragging = null;
ink.addEventListener("pointerdown", (e) => {
  if (!penMode || e.button !== 0) return;
  ink.setPointerCapture(e.pointerId);
  const hitMark = markAt(e.offsetX, e.offsetY);
  if (hitMark) {
    const m = hitMark.m;
    dragging = {m, ga: hitMark.a, gb: hitMark.b, prev: {center: m.center.clone(), normal: m.normal.clone()}};
    m.mats[0].color.set(0xE9A585);
    ink.style.cursor = "grabbing";
  } else {
    stroke = [[e.offsetX, e.offsetY]];
  }
});
ink.addEventListener("pointermove", (e) => {
  if (dragging) {
    const m = dragging.m, hit = pick(e.offsetX, e.offsetY);
    const q = rayLocal(e.offsetX, e.offsetY).intersectPlane(
      new THREE.Plane().setFromNormalAndCoplanarPoint(m.normal, m.center), new THREE.Vector3());
    const onThisFace = q && mesh.geometry.boundingBox.clone().expandByScalar(0.5).containsPoint(q);
    if (onThisFace) {          // stay on the face's plane (glides straight over holes instead of falling into them)
      const {u, v} = planeBasis(m.normal);
      m.center.copy(q).addScaledVector(u, -dragging.ga).addScaledVector(v, -dragging.gb);
      refreshMark(m); m.mats[0].color.set(0xE9A585);
    } else if (hit) {          // dragged past the edge of this face: continue on whatever face is under the pointer
      m.normal.copy(hit.face.normal); m.center.copy(mesh.worldToLocal(hit.point.clone()));
      dragging.ga = dragging.gb = 0; refreshMark(m); m.mats[0].color.set(0xE9A585);
    }
    return;
  }
  if (stroke) { stroke.push([e.offsetX, e.offsetY]); return; }
  if (penMode) ink.style.cursor = markAt(e.offsetX, e.offsetY) ? "grab" : "crosshair";
});
ink.addEventListener("pointerup", (e) => {
  if (dragging) {
    const m = dragging.m;
    const qd = rayLocal(e.offsetX, e.offsetY).intersectPlane(
      new THREE.Plane().setFromNormalAndCoplanarPoint(m.normal, m.center), new THREE.Vector3());
    const okDrop = pick(e.offsetX, e.offsetY) || (qd && mesh.geometry.boundingBox.clone().expandByScalar(0.5).containsPoint(qd));
    if (!okDrop) {   // dropped off the part: put it back
      m.center.copy(dragging.prev.center); m.normal.copy(dragging.prev.normal);
      toast("Drop the mark on the part itself.");
    } else toast(`Mark #${m.n} moved`);
    refreshMark(m); publish();
    dragging = null; ink.style.cursor = "grab";
    return;
  }
  if (!stroke) return;
  const pts = stroke; stroke = null;
  if (pts.length >= 4) addMarkFromStroke(pts);
});

/* ---------------- shape recognition (snaps rough strokes to clean shapes) ---------------- */
function recognize(pts) {
  const n = pts.length;
  let len = 0; for (let i = 1; i < n; i++) len += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
  const [sx, sy] = pts[0], [ex, ey] = pts[n - 1];
  const gap = Math.hypot(ex - sx, ey - sy);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const bw = maxX - minX, bh = maxY - minY;

  // Open stroke -> arrow pointing at the end of the stroke
  if (gap > 0.35 * len || len < 25) return {type: "arrow", x1: sx, y1: sy, x2: ex, y2: ey};
  // Closed stroke: rectangle if it fills its bounding box (ellipse ~0.785, rectangle ~1)
  let area = 0; for (let i = 0; i < n; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n]; area += x1 * y2 - x2 * y1; }
  const fill = Math.abs(area / 2) / Math.max(bw * bh, 1);
  if (fill > 0.86) return {type: "box", x: minX, y: minY, w: bw, h: bh};
  const aspect = Math.max(bw, bh) / Math.max(Math.min(bw, bh), 1);
  if (aspect < 1.35) return {type: "circle", cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, r: (bw + bh) / 4};
  return {type: "ellipse", cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, rx: bw / 2, ry: bh / 2};
}

/* ---------------- sync with Python ---------------- */
function publish() {
  setValue({model_id: modelId, marks: marks.map(m => ({
    n: m.n, shape: m.shape, point: m.point, normal: m.normal.toArray().map(x => +x.toFixed(3)), size_mm: m.size_mm,
    dims: Object.fromEntries(Object.entries(m.dims || {}).filter(([k, v]) => typeof v === "number").map(([k, v]) => [k, +v.toFixed(2)])),
  }))});
}

function restoreMarks(saved) {   // after an iframe reload (Python already has them, so no publish)
  clearMarks(false);
  for (const s of saved) {
    const m = {n: s.n, shape: s.shape, normal: new THREE.Vector3(...s.normal).normalize(), size_mm: s.size_mm,
               center: new THREE.Vector3(...s.point).sub(cadCenter), dims: s.dims || {r: s.size_mm || 3}};
    marks.push(m); refreshMark(m);
  }
}

// debug/inspection hook (handy for automated UI tests)
window.__viewer = {camera, controls, renderer, scene, pick, rayLocal, mmPerPxAt, updateBadges, markAt, get marks() { return marks; }, get dist() { return camera.position.distanceTo(controls.target); }};

/* ---------------- render loop + Streamlit render events ---------------- */
(function loop() {
  requestAnimationFrame(loop);
  applyZoom();
  controls.update();
  updateBadges();
  renderer.render(scene, camera);
  drawMarks();
})();

window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  $("dims").textContent = a.dims || "";
  if (a.model_id !== modelId) {
    modelId = a.model_id; resize(); loadModel(a.stl_b64);
    restoreMarks(a.marks || []);
  }
});
resize();
</script>
